openapi: 3.1.0
info:
  title: Leafy API
  version: 1.0.0
  description: Initial versioned API foundation. Unimplemented domain routes intentionally return 404.
servers:
  - url: https://api.example.com/api/v1
    description: Replace with the deployed backend URL.
  - url: http://localhost:5000/api/v1
    description: Local development.
paths:
  /health/live:
    get:
      operationId: getLiveness
      summary: Check API process liveness
      responses:
        "200":
          description: The API process is responding.
  /health/ready:
    get:
      operationId: getReadiness
      summary: Check database readiness
      responses:
        "200":
          description: Supabase profile table is available.
        "503":
          description: The database is not ready.
  /auth/register:
    post:
      operationId: register
      summary: Register with Supabase Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, phone, password, confirmPassword]
              properties:
                name: { type: string, minLength: 2, maxLength: 120 }
                email: { type: string, format: email }
                phone: { type: string, minLength: 7, maxLength: 20 }
                password: { type: string, minLength: 8, maxLength: 128, format: password }
                confirmPassword: { type: string, format: password }
      responses:
        "202":
          description: Registration accepted; the user may need to verify email.
        "400":
          description: Request validation failed.
        "429":
          description: Rate limit exceeded.
  /auth/login:
    post:
      operationId: login
      summary: Sign in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        "200":
          description: Access token returned; refresh token is set in an HTTP-only cookie.
        "401":
          description: Credentials are invalid.
        "429":
          description: Rate limit exceeded.
  /auth/refresh:
    post:
      operationId: refreshSession
      summary: Rotate a Supabase Auth session
      responses:
        "200":
          description: New access token and refresh cookie returned.
        "401":
          description: Refresh token is missing or invalid.
  /auth/password-reset:
    post:
      operationId: requestPasswordReset
      summary: Request password recovery
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "202":
          description: Non-enumerating recovery response.
  /auth/password:
    post:
      operationId: updatePassword
      summary: Change the authenticated user's password
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, minLength: 8, maxLength: 128, format: password }
      responses:
        "204":
          description: Password updated.
        "401":
          description: Authentication required.
  /auth/logout:
    post:
      operationId: logout
      summary: Revoke the current Supabase Auth session
      security: [{ bearerAuth: [] }]
      responses:
        "204":
          description: Session revoked and refresh cookie cleared.
  /auth/me:
    get:
      operationId: getCurrentUser
      summary: Read the authenticated user's profile
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: User and RLS-scoped profile returned.
  /contact:
    post:
      operationId: createContactMessage
      summary: Persist a public contact message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, topic, message]
              properties:
                name: { type: string, minLength: 2, maxLength: 120 }
                email: { type: string, format: email }
                topic:
                  type: string
                  enum: [General question, Volunteering, Partnership, Community initiative, Story consent]
                message: { type: string, minLength: 1, maxLength: 5000 }
      responses:
        "201":
          description: Message persisted.
        "400":
          description: Request validation failed.
        "429":
          description: Rate limit exceeded.
  /innovations:
    get:
      operationId: listPublishedInnovations
      summary: List published innovations
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, maximum: 10000, default: 0 }
      responses:
        "200":
          description: A paginated list of published innovations.
    post:
      operationId: createInnovationDraft
      summary: Create an innovation draft for the authenticated user
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, summary, description, agriculturalSector, developmentStage]
              properties:
                title: { type: string, minLength: 3, maxLength: 180 }
                summary: { type: string, minLength: 10, maxLength: 500 }
                description: { type: string, minLength: 10, maxLength: 20000 }
                agriculturalSector: { type: string, minLength: 2, maxLength: 120 }
                developmentStage: { type: string, minLength: 2, maxLength: 80 }
                supportNeeds:
                  type: array
                  maxItems: 10
                  items: { type: string, minLength: 1, maxLength: 80 }
                organisationId: { type: string, format: uuid }
      responses:
        "201":
          description: A draft owned by the authenticated user.
        "401":
          description: Authentication required.
  /innovations/mine:
    get:
      operationId: listMyInnovations
      summary: List the authenticated user's innovations
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: The caller's innovation records.
  /innovations/{innovationId}:
    parameters:
      - in: path
        name: innovationId
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getPublishedInnovation
      summary: Get a published innovation
      responses:
        "200":
          description: Published innovation details.
        "404":
          description: Innovation not found or not public.
    patch:
      operationId: updateInnovationDraft
      summary: Update an owned innovation draft
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                title: { type: string, minLength: 3, maxLength: 180 }
                summary: { type: string, minLength: 10, maxLength: 500 }
                description: { type: string, minLength: 10, maxLength: 20000 }
                agriculturalSector: { type: string, minLength: 2, maxLength: 120 }
                developmentStage: { type: string, minLength: 2, maxLength: 80 }
                supportNeeds:
                  type: array
                  maxItems: 10
                  items: { type: string, minLength: 1, maxLength: 80 }
      responses:
        "200":
          description: Updated draft.
        "409":
          description: Not an owned draft.
  /innovations/{innovationId}/submit:
    post:
      operationId: submitInnovation
      summary: Submit an owned draft for review
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: innovationId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The owned draft transitioned to submitted.
        "409":
          description: Not an owned draft.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
